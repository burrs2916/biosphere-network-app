name: CI / Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # 前端类型检查
  # ============================================================
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check

  # ============================================================
  # Rust 编译 + Clippy（Workspace 根执行，检查所有 crate）
  # ============================================================
  rust-check:
    name: Rust Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: biosphere-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Cargo check (workspace)
        run: cargo check --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace -- -W warnings

  # ============================================================
  # 跨平台发布构建（仅 push 触发）
  # ============================================================
  publish-tauri:
    name: Publish ${{ matrix.platform }}
    needs: [frontend-check, rust-check]
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macOS-x64
            runner: macos-latest
            args: --target x86_64-apple-darwin
          - platform: Linux
            runner: ubuntu-22.04
            args: ''
          - platform: Windows
            runner: windows-latest
            args: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Strawberry Perl (Windows)
        if: matrix.platform == 'Windows'
        run: choco install strawberryperl -y --version=5.38.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS-arm64' && 'aarch64-apple-darwin' || matrix.platform == 'macOS-x64' && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: biosphere-v1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: app-v__VERSION__
          releaseName: 'Biosphere Network Tools v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          args: ${{ matrix.args }}
