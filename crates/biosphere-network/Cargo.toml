[package]
name = "biosphere-network"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
rayon = "1.10"
num_cpus = "1.16"
socket2 = "0.5"
lazy_static = "1.4"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
chrono = { version = "0.4", features = ["serde"] }
trust-dns-resolver = "0.23"
async-trait = "0.1"
regex = "1"
base64 = "0.22"
urlencoding = "2.1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
digest = "0.10"
base32 = "0.4"
bs58 = "0.5"
hex = "0.4"
rand = "0.8"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.0", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "time"] }
walkdir = "2.5"
reqwest = { version = "0.12", features = ["json", "blocking"] }
flate2 = "1.0"
tar = "0.4"
openssl = { version = "0.10", features = ["vendored"] }
x509-parser = "0.16"
idna = "1.0"
encoding_rs = "0.8"
url = "2.5"
tokio-native-tls = "0.3"
native-tls = "0.2"
ipnet = "2.9"
serde_yaml = "0.9"
which = "6"
rust_xlsxwriter = "0.79"

[dev-dependencies]
tokio-test = "0.4"
